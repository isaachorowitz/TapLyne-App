name: Taplyne
options:
  bundleIdPrefix: agency.ziplyne
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  TaplyneServer:
    path: Packages/TaplyneServer

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Taplyne:
    type: application
    platform: macOS
    sources:
      - path: Taplyne
        excludes:
          - Taplyne.entitlements
          - Info.plist
          - Bluetooth/LICENSE-AGPL-3.0
    dependencies:
      - package: TaplyneServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.ziplyne.taplyne
        PRODUCT_NAME: Taplyne
        INFOPLIST_FILE: Taplyne/Info.plist
        CODE_SIGN_ENTITLEMENTS: Taplyne/Taplyne.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Taplyne/Taplyne-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
